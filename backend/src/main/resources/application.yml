spring:
  application:
    name: log-monitoring-system
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:10s}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

shutdown:
  timeout-ms: ${SHUTDOWN_TIMEOUT_MS:5000}

notification:
  http-timeout-ms: ${NOTIFICATION_HTTP_TIMEOUT_MS:2000}

search:
  default-range-hours: ${SEARCH_DEFAULT_RANGE_HOURS:1}
  max-range-hours: ${SEARCH_MAX_RANGE_HOURS:168}
  default-page-size: ${SEARCH_DEFAULT_PAGE_SIZE:50}
  max-page-size: ${SEARCH_MAX_PAGE_SIZE:200}
  max-search-length: ${SEARCH_MAX_SEARCH_LENGTH:128}
  max-filter-length: ${SEARCH_MAX_FILTER_LENGTH:256}

analytics:
  default-range-hours: ${ANALYTICS_DEFAULT_RANGE_HOURS:24}
  max-range-hours: ${ANALYTICS_MAX_RANGE_HOURS:168}
  max-buckets: ${ANALYTICS_MAX_BUCKETS:1000}
  top-services-limit: ${ANALYTICS_TOP_SERVICES_LIMIT:5}
  top-errors-limit: ${ANALYTICS_TOP_ERRORS_LIMIT:10}

jwt:
  secret: ${JWT_SECRET:SuperSecretJwtSigningKeyWithMinimum256BitsLengthForHmacSha256!}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

auth:
  login-burst-capacity: ${AUTH_LOGIN_BURST_CAPACITY:5}
  login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:60}
  refresh-token-expiration-seconds: ${AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}

ingestion:
  queue:
    capacity: ${INGESTION_QUEUE_CAPACITY:50000}
  workers: ${INGESTION_WORKER_COUNT:4}
  batch:
    max-size: ${INGESTION_BATCH_MAX_SIZE:500}
    max-wait-ms: ${INGESTION_BATCH_MAX_WAIT_MS:500}
  enqueue-timeout-ms: ${INGESTION_ENQUEUE_TIMEOUT_MS:5}
  limits:
    max-http-body-bytes: ${INGESTION_MAX_HTTP_BODY_BYTES:1048576}
    max-batch-size: ${INGESTION_BATCH_MAX_SIZE:500}
    max-message-length: ${INGESTION_MAX_MESSAGE_LENGTH:4000}
    max-stack-trace-length: ${INGESTION_MAX_STACK_TRACE_LENGTH:16000}
    max-exception-message-length: ${INGESTION_MAX_EXCEPTION_MESSAGE_LENGTH:4000}
    max-field-length: ${INGESTION_MAX_FIELD_LENGTH:256}
    max-context-serialized-bytes: ${INGESTION_MAX_CONTEXT_BYTES:32768}
    max-tags-serialized-bytes: ${INGESTION_MAX_TAGS_BYTES:16384}
    max-context-keys: ${INGESTION_MAX_CONTEXT_KEYS:50}
    max-tag-keys: ${INGESTION_MAX_TAG_KEYS:50}
    max-key-length: ${INGESTION_MAX_CONTEXT_KEY_LENGTH:100}
    max-nesting-depth: ${INGESTION_MAX_CONTEXT_DEPTH:5}
    max-collection-entries: ${INGESTION_MAX_COLLECTION_ENTRIES:100}
    max-string-value-length: ${INGESTION_MAX_CONTEXT_STRING_LENGTH:4000}

security:
  redaction:
    enabled: ${LOG_REDACTION_ENABLED:true}
    replacement: "${LOG_REDACTION_REPLACEMENT:[REDACTED]}"
    fields:
      - password
      - passwd
      - secret
      - token
      - access_token
      - refresh_token
      - api_key
      - apikey
      - raw_api_key
      - authorization
      - cookie
      - private_key
      - client_secret
      - webhook_token
      - bot_token

api-key:
  requests-per-second: ${API_KEY_REQUESTS_PER_SECOND:100}
  burst-capacity: ${API_KEY_BURST_CAPACITY:200}
  last-used-update-interval-seconds: ${API_KEY_LAST_USED_UPDATE_INTERVAL_SECONDS:60}

livetail:
  max-connections-per-user: ${LIVETAIL_MAX_CONNECTIONS_PER_USER:3}
  max-connections-per-ip: ${LIVETAIL_MAX_CONNECTIONS_PER_IP:20}
  max-subscriptions-per-session: ${LIVETAIL_MAX_SUBSCRIPTIONS_PER_SESSION:8}
  inbound-core-pool-size: ${LIVETAIL_INBOUND_CORE_POOL_SIZE:2}
  inbound-max-pool-size: ${LIVETAIL_INBOUND_MAX_POOL_SIZE:8}
  inbound-queue-capacity: ${LIVETAIL_INBOUND_QUEUE_CAPACITY:128}
  outbound-core-pool-size: ${LIVETAIL_OUTBOUND_CORE_POOL_SIZE:2}
  outbound-max-pool-size: ${LIVETAIL_OUTBOUND_MAX_POOL_SIZE:8}
  outbound-queue-capacity: ${LIVETAIL_OUTBOUND_QUEUE_CAPACITY:256}
  broker-send-timeout-ms: ${LIVETAIL_BROKER_SEND_TIMEOUT_MS:100}
  message-size-limit-bytes: ${LIVETAIL_MESSAGE_SIZE_LIMIT_BYTES:131072}
  send-time-limit-ms: ${LIVETAIL_SEND_TIME_LIMIT_MS:10000}
  send-buffer-size-limit-bytes: ${LIVETAIL_SEND_BUFFER_SIZE_LIMIT_BYTES:524288}
  allowed-origin-patterns:
    - ${LIVETAIL_ALLOWED_ORIGIN_1:http://localhost:*}
    - ${LIVETAIL_ALLOWED_ORIGIN_2:http://127.0.0.1:*}
