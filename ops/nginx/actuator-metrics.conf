# Include this location in the HTTPS reverse-proxy server for the backend.
# Replace the private-network examples with the exact Prometheus scraper
# addresses before deploying; do not expose /actuator/prometheus publicly.
location = /actuator/prometheus {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://log-monitoring-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
